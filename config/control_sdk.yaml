# 无人机编号由 launch 的 drone_id 参数设置，默认 1。
# 配置 SDK 通信与到达判据；不设置 px4ctrl 高度/速度；任务 timeout 由各 Action Goal 指定。
feedback_rate: 10.0

topics:
  control: /control
  goal: /goal_with_id
  trajectory: ""  # /drone_{drone_id}_planning/pos_cmd
  planning_speed: ""  # /drone_{drone_id}_planning/max_vel，Float64，持续生效的规划速度上限
  yaw_override: ""  # /drone_{drone_id}_control/yaw_override，Float64，终点绝对航向 rad
  yaw_status: ""  # /drone_{drone_id}_control/yaw_override/status，String
  flight_state: /nav/status/flight_state
  drone_state: ""  # 留空时使用 /drone_{drone_id}_state
  mavros_state: /mavros/state
  extended_state: /mavros/extended_state
  odometry: /mavros/local_position/odom  # 起飞相对高度、当前速度模长；不用于 Goto 距离
  navigation_odometry: ""  # 留空时 /drone_{drone_id}_visual_slam/odom，必须与 Planner 同源
  altitude: /mavros/altitude

frames:
  world: world  # WayPoint 地图、重定位初值、Goto 目标及定位里程计的原生坐标；只校验，不做 TF

actions:
  takeoff: /nav/flight/takeoff
  land: /nav/flight/land
  goto: /nav/flight/goto
  return_home: /nav/flight/return_home

# V1.4 的到达判据保留在 SDK 配置；不写入 Planner/px4ctrl 参数。
goto:
  arrival_total_dist: 0.30
  arrival_horiz_dist: 0.25
  stable_time: 1.0

# Spikive-SLAM main 的现有话题；空值按 drone_id 自动生成。
localization:
  map_topic: ""
  initial_pose_topic: ""
  match_status_topic: ""
  match_transform_topic: ""
  map_echo_topic: /map
  load_map_service: /nav/localization/load_map
  relocalize_action: /nav/localization/relocalize
  status_topic: /nav/status/localization
  status_rate: 10.0
  map_ack_timeout: 5.0  # 仅服务确认等待；重定位算法超时沿用 SLAM 后端。

services:
  emergency: /nav/safety/emergency

# SDK 独立录包。Goal.topics 非空时覆盖配置。
record:
  action: /nav/map/record
  output_directory: /home/colman/data  # Goal.bag_path 非空时覆盖
  split_enabled: false
  split_size_mib: 500
  topics:
    - /rslidar_imu_data
    - /rslidar_points
    - /cloud_registered_body
    - /Odometry
    - /clock
    - /control
    - /diagnostics
    - /drone_2_auto_manager_status
    - /drone_2_cloud_registered
    - /drone_2_control
    - /drone_2_control/hold_status
    - /drone_2_control/rc_drive
    - /drone_2_ego_planner_node/failed_list
    - /drone_2_ego_planner_node/global_list
    - /drone_2_ego_planner_node/goal_point
    - /drone_2_ego_planner_node/goal_point_array
    - /drone_2_ego_planner_node/grid_map/occupancy
    - /drone_2_ego_planner_node/grid_map/occupancy_inflate
    - /drone_2_ego_planner_node/init_list
    - /drone_2_ego_planner_node/optimal_list
    - /drone_2_ego_planner_node/optimal_list_array
    - /drone_2_image_raw/mouse_click
    - /drone_2_localization_cloud_status
    - /drone_2_localization_match_status
    - /drone_2_odom_visualization/height
    - /drone_2_odom_visualization/path
    - /drone_2_odom_visualization/pose
    - /drone_2_odom_visualization/robot
    - /drone_2_odom_visualization/robot_array
    - /drone_2_odom_visualization/sensor
    - /drone_2_odom_visualization/trajectory
    - /drone_2_odom_visualization/velocity
    - /drone_2_planning/control_hold
    - /drone_2_planning/data_display
    - /drone_2_planning/goal_status
    - /drone_2_planning/operator_hold
    - /drone_2_planning/pos_cmd
    - /drone_2_planning/trajectory
    - /drone_2_state
    - /drone_2_terrain_following/status
    - /drone_2_traj_server/heartbeat
    - /drone_2_visual_slam/odom
    - /drone_state
    - /dynablox_detector/dynamic_points
    - /foxglove_nodelet_manager/bond
    - /goal_with_id
    - /mavros/altitude
    - /mavros/battery
    - /mavros/companion_process/status
    - /mavros/local_position/odom
    - /mavros/odometry/in
    - /mavros/param/param_value
    - /mavros/rc/in
    - /mavros/state
    - /mavros/sys_status
    - /new_goals_arrow
    - /nvblox_detector/dynamic_points
    - /path
    - /rc_drive/intent_arrow
    - /rc_drive/intent_arrow_array
    - /rc_drive/status
    - /terrain_surface_map
    - /tf
    - /tf_static
    - /track_drone_point

# SDK 点云后处理：读取已关闭 bag 中的 cloud topic，全量拼接为 PCD。
# 输入目录默认跟随 record.output_directory。Goal 可指定其他目录或文件名。
post_process:
  action: /nav/map/post_process
  pointcloud_topic: ""  # 留空使用 /drone_{drone_id}_cloud_registered
  input_directory: ""  # 留空使用 record.output_directory
  output_directory: ""  # 留空使用 $HOME/spikive-output
  lio_nodes:  # 存在任一节点时拒绝后处理，等待 SLAM/LIO 结束
    - /laserMapping
    - /slam_to_uav_transform
  max_points: 0  # 0 不限制；正数用于防止内存失控
  feedback_period: 0.2  # 秒

# 只映射 topic，所有消息内容和采样时间原样保留。
data:
  pointcloud_source: ""  # /drone_{drone_id}_cloud_registered
  odometry: /nav/data/odom
  pointcloud: /nav/data/pointcloud

# data_mapping 内的可视化支路，沿用 visual_pointcloud_node 抽稀逻辑。
# 修改后重启节点；保留原始完整点云，抽稀比例不改变帧率或坐标系。
visual_pointcloud:
  enabled: true
  input_topic: ""  # 留空复用 data/pointcloud_source，默认 /drone_{drone_id}_cloud_registered
  output_topic: /nav/data/visual_pointcloud
  keep_ratio: 0.1  # (0, 1]；1 原样转发，非空云至少保留 1 点
