# 无人机编号由 launch 的 drone_id 参数设置，默认 1。
# 配置 SDK 通信与到达判据；不设置 px4ctrl 高度/速度；任务 timeout 由各 Action Goal 指定。
feedback_rate: 10.0

topics:
  control: /control
  goal: /goal_with_id
  trajectory: ""  # /drone_{drone_id}_planning/pos_cmd
  flight_state: /nav/status/flight_state
  drone_state: ""  # 留空时使用 /drone_{drone_id}_state
  mavros_state: /mavros/state
  extended_state: /mavros/extended_state
  odometry: /mavros/local_position/odom  # 起飞相对高度、当前速度模长；不用于 Goto 距离
  navigation_odometry: ""  # 留空时 /drone_{drone_id}_visual_slam/odom，必须与 Planner 同源
  altitude: /mavros/altitude

frames:
  world: world  # WayPoint 地图、重定位初值、Goto 目标及定位里程计的原生坐标；只校验，不做 TF

actions:
  takeoff: /nav/flight/takeoff
  land: /nav/flight/land
  goto: /nav/flight/goto
  return_home: /nav/flight/return_home

# V1.4 的到达判据保留在 SDK 配置；不写入 Planner/px4ctrl 参数。
goto:
  arrival_total_dist: 0.30
  arrival_horiz_dist: 0.25
  stable_time: 1.0

# Spikive-SLAM main 的现有话题；空值按 drone_id 自动生成。
localization:
  map_topic: ""
  initial_pose_topic: ""
  match_status_topic: ""
  match_transform_topic: ""
  map_echo_topic: /map
  load_map_service: /nav/localization/load_map
  relocalize_action: /nav/localization/relocalize
  status_topic: /nav/status/localization
  status_rate: 10.0
  map_ack_timeout: 5.0  # 仅服务确认等待；重定位算法超时沿用 SLAM 后端。

services:
  emergency: /nav/safety/emergency

# SLAM save_result 已有 JSON 协议；空值按 drone_id 生成。
record:
  action: /nav/map/record
  start_topic: ""
  stop_topic: ""
  status_topic: ""

# 只映射 topic，所有消息内容和采样时间原样保留。
data:
  pointcloud_source: ""  # /drone_{drone_id}_cloud_registered
  odometry: /nav/data/odom
  pointcloud: /nav/data/pointcloud

# data_mapping 内的可视化支路，沿用 visual_pointcloud_node 抽稀逻辑。
# 修改后重启节点；保留原始完整点云，抽稀比例不改变帧率或坐标系。
visual_pointcloud:
  enabled: true
  input_topic: ""  # 留空复用 data/pointcloud_source，默认 /drone_{drone_id}_cloud_registered
  output_topic: /nav/data/visual_pointcloud
  keep_ratio: 0.1  # (0, 1]；1 原样转发，非空云至少保留 1 点
